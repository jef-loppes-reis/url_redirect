<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Nada sai desta página: sem fontes, scripts ou imagens externas, e sem referrer. -->
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#2a0e1f">
  <title>Nanda, te amo</title>
  <style>
    :root {
      --bg-1: #2a0e1f;
      --bg-2: #5b1a3a;
      --rose: #ff7aa8;
      --rose-soft: #ffb3cc;
      --cream: #fff4f0;
      --gold: #ffd9a0;
      --glass: rgba(255, 255, 255, 0.07);
      --glass-line: rgba(255, 255, 255, 0.16);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      overflow: hidden;
      color: var(--cream);
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
      background:
        radial-gradient(1200px 700px at 15% 10%, rgba(255, 122, 168, 0.22), transparent 60%),
        radial-gradient(900px 600px at 90% 90%, rgba(255, 217, 160, 0.16), transparent 60%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
    }

    /* corações flutuantes (criados pelo script; sem script a página continua bonita) */
    .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .hearts span {
      position: absolute;
      bottom: -60px;
      color: var(--rose);
      opacity: 0;
      animation: float linear infinite;
      filter: drop-shadow(0 0 8px rgba(255, 122, 168, 0.55));
    }
    @keyframes float {
      0%   { transform: translateY(0) rotate(-8deg) scale(0.8); opacity: 0; }
      12%  { opacity: 0.85; }
      100% { transform: translateY(-115dvh) rotate(12deg) scale(1.15); opacity: 0; }
    }

    .card {
      position: relative;
      width: min(560px, 100%);
      padding: clamp(32px, 7vw, 56px) clamp(24px, 6vw, 48px);
      text-align: center;
      background: var(--glass);
      border: 1px solid var(--glass-line);
      border-radius: 28px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      animation: appear 1.2s cubic-bezier(.2, .8, .2, 1) both;
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to   { opacity: 1; transform: none; }
    }

    .heart-main {
      width: clamp(64px, 16vw, 88px);
      margin: 0 auto 20px;
      color: var(--rose);
      filter: drop-shadow(0 8px 24px rgba(255, 122, 168, 0.6));
      animation: beat 1.8s ease-in-out infinite;
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.14); }
      28% { transform: scale(1); }
      42% { transform: scale(1.1); }
      70% { transform: scale(1); }
    }

    .name {
      font-family: "Segoe Script", "Brush Script MT", "Snell Roundhand", cursive;
      font-size: clamp(2.2rem, 9vw, 3.4rem);
      color: var(--rose-soft);
      line-height: 1.1;
    }
    h1 {
      margin-top: 4px;
      font-weight: 400;
      font-size: clamp(2.6rem, 12vw, 4.4rem);
      letter-spacing: 0.01em;
      line-height: 1.05;
      background: linear-gradient(90deg, var(--cream), var(--gold) 55%, var(--rose-soft));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .divider {
      width: 72px;
      height: 2px;
      margin: 26px auto;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--rose), transparent);
    }
    p.msg {
      font-size: clamp(1.05rem, 3.6vw, 1.25rem);
      line-height: 1.7;
      color: rgba(255, 244, 240, 0.9);
    }
    p.sign {
      margin-top: 22px;
      font-style: italic;
      color: var(--gold);
    }

    /* painel discreto: só aparece quando o Mercado Livre devolve ?code=... */
    #oauth {
      margin-top: 28px;
      padding: 14px 16px;
      font: 0.9rem/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--cream);
      background: rgba(0, 0, 0, 0.28);
      border: 1px dashed var(--glass-line);
      border-radius: 14px;
    }
    #oauth[hidden] { display: none; }
    #oauth button {
      margin-top: 8px;
      padding: 9px 16px;
      font: inherit;
      font-weight: 600;
      color: #2a0e1f;
      background: var(--rose-soft);
      border: 0;
      border-radius: 10px;
      cursor: pointer;
    }
    #oauth button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      .hearts { display: none; }
      .heart-main, .card { animation: none; }
    }
  </style>
</head>
<body>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <main class="card">
    <svg class="heart-main" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>

    <div class="name">Nanda,</div>
    <h1>te amo.</h1>
    <div class="divider"></div>

    <p class="msg">
      Obrigado por cada dia ao seu lado.<br>
      Você deixa tudo mais leve, mais bonito<br>
      e faz de qualquer lugar o meu lar.
    </p>
    <p class="sign">Com todo o meu amor.</p>

    <aside id="oauth" hidden>
      <p>Autorização recebida. O endereço desta página contém o código.</p>
      <button type="button" id="copy">Copiar endereço completo</button>
      <p id="copy-status" role="status" aria-live="polite"></p>
    </aside>
  </main>

  <script>
    (function () {
      "use strict";

      // 1) corações flutuantes
      var box = document.getElementById("hearts");
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (box && !reduce) {
        for (var i = 0; i < 16; i++) {
          var h = document.createElement("span");
          h.textContent = "♥";
          h.style.left = Math.round(Math.random() * 100) + "%";
          h.style.fontSize = (14 + Math.random() * 26).toFixed(0) + "px";
          h.style.animationDuration = (9 + Math.random() * 9).toFixed(1) + "s";
          h.style.animationDelay = (Math.random() * 12).toFixed(1) + "s";
          box.appendChild(h);
        }
      }

      // 2) auxílio do OAuth: só aparece com ?code= ou ?error=; tudo local, nada é enviado
      var params = new URLSearchParams(window.location.search);
      if (params.has("code") || params.has("error")) {
        var panel = document.getElementById("oauth");
        var status = document.getElementById("copy-status");
        panel.hidden = false;
        document.getElementById("copy").addEventListener("click", function () {
          var text = window.location.href;
          function done(msg) { status.textContent = msg; }
          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(
              function () { done("Copiado! Cole no terminal."); },
              function () { done("Não consegui copiar; copie pela barra de endereço."); }
            );
          } else {
            var ta = document.createElement("textarea");
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand("copy"); done("Copiado! Cole no terminal."); }
            catch (e) { done("Não consegui copiar; copie pela barra de endereço."); }
            document.body.removeChild(ta);
          }
        });
      }
    })();
  </script>
</body>
</html>
